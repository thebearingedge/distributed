name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          shared-key: check
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Check Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          shared-key: test
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Start services
        run: docker compose -f infrastructure/docker-compose.yaml up -d --wait --wait-timeout 120

      - name: Run tests
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/postgres
        run: cargo test --workspace --locked

      - name: Show service logs
        if: failure()
        run: docker compose -f infrastructure/docker-compose.yaml logs --no-color

      - name: Stop services
        if: always()
        run: docker compose -f infrastructure/docker-compose.yaml down -v
